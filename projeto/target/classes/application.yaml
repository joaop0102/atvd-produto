spring:
  application:
    name: estoque-api

  datasource:
    # Banco H2 em arquivo compartilhado entre as instancias do mesmo .jar.
    # AUTO_SERVER permite que processos JVM diferentes acessem o mesmo banco.
    url: jdbc:h2:file:./data/estoquedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  # Pode ser sobrescrita por variável de ambiente ou argumento da JVM.
  # Exemplos:
  # PORT=8081 java -jar target/estoque-api.jar
  # java -jar target/estoque-api.jar --server.port=8082
  port: ${PORT:8080}
